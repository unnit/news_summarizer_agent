# Nginx configuration for News Summarizer Agent
# Place this file in your nginx sites-available directory

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain
    
    # Increase timeouts for long-running operations
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    
    # Increase client body size if needed
    client_max_body_size 50M;
    
    location / {
        proxy_pass http://127.0.0.1:5000;  # Your Flask app port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable buffering for better performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Handle large file uploads/downloads
    location /download/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Allow large file downloads
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }
}
