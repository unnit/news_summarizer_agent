# Systemd service configuration for News Summarizer Agent
# Place this file as /etc/systemd/system/news-summarizer.service

[Unit]
Description=News Summarizer Agent Web App
After=network.target

[Service]
Type=simple
User=your-username  # Replace with your username
WorkingDirectory=/path/to/your/news_summarizer_agent  # Replace with your project path
Environment=PATH=/path/to/your/venv/bin  # Replace with your virtual environment path
ExecStart=/path/to/your/venv/bin/python web_app.py  # Replace with your Python path
Restart=always
RestartSec=10

# Timeout settings
TimeoutStartSec=60
TimeoutStopSec=30

[Install]
WantedBy=multi-user.target
